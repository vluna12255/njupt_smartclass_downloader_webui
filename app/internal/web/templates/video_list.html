{{if .Started}}
    {{if .Videos}}
        {{range .Videos}}
<div class="video-card bg-white rounded-lg shadow-md cursor-pointer relative overflow-hidden transition-all duration-200 hover:shadow-xl hover:-translate-y-1 group" onclick="toggleSelection(this)">
    <input type="checkbox" name="video_ids" value="{{.ID}}" data-video-title="{{.Title}}" class="hidden">
    <div class="check-icon hidden absolute top-2 right-2 bg-blue-500 text-white rounded-full p-1 shadow-lg z-10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <div class="w-full aspect-video bg-gray-200">
        {{if .CoverURL}}<img src="{{.CoverURL}}" draggable="false" class="w-full h-full object-cover">{{else}}<div class="w-full h-full flex items-center justify-center text-gray-400">无封面</div>{{end}}
    </div>
    <div class="p-3">
        <h3 class="font-bold text-gray-800 text-sm line-clamp-1 mb-1" title="{{.CourseName}} {{.Teachers}}">{{.CourseName}}&nbsp;&nbsp;{{.Teachers}}</h3>
        <p class="text-xs text-gray-500 truncate font-mono">{{.StartTime.Format "2006-01-02 15:04:05"}}-{{.StopTime.Format "15:04:05"}}</p>
    </div>
</div>
        {{end}}
    {{else}}
<div class="col-span-full text-center text-gray-500 py-20 animate-fade-in">
    <p class="text-base font-medium text-slate-600">未找到相关课程</p>
    <p class="text-sm text-slate-400 mt-2">请尝试其他关键词</p>
</div>
    {{end}}
{{end}}

<div class="max-w-4xl mx-auto p-4">
    <h2 class="text-lg font-bold text-gray-800 mb-3">任务列表</h2>
    {{if .}}
    <div class="space-y-3">
        {{range .}}
        <div class="bg-white px-5 py-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-start">
                <div class="flex flex-col min-w-0">
                    <span class="text-sm font-bold text-gray-800 truncate">{{.Title}}</span>
                    {{if .Error}}<span class="text-xs text-red-500 font-medium truncate">{{.Error}}</span>{{else}}<span class="text-xs text-gray-500 font-mono truncate">{{.Message}}</span>{{end}}
                </div>
                <span class="text-xs font-bold whitespace-nowrap px-2 py-1 rounded-md bg-gray-100 text-gray-600">{{.StatusText}}</span>
            </div>
        </div>
        {{end}}
    </div>
    {{else}}
    <div class="text-gray-400 text-sm py-12 border border-dashed border-gray-300 rounded-xl text-center bg-gray-50">暂无进行中的任务</div>
    {{end}}
</div>
